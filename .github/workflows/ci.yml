name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  core-linux:
    name: Layout engine (Linux)
    runs-on: ubuntu-latest
    container: swift:6.1-noble
    steps:
      - uses: actions/checkout@v4
      - run: swift build
      - run: swift test

  macos:
    name: App (macOS)
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - run: swift --version
      - run: swift build
      - run: swift test
      - run: scripts/bundle.sh
      - uses: actions/upload-artifact@v4
        with:
          name: Espalier
          path: dist/Espalier.zip
